name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mercato_test"
      UPSTASH_REDIS_REST_URL: "https://example-upstash.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "sample_token_for_ci_pipeline"
      BETTER_AUTH_SECRET: "ci_pipeline_dummy_better_auth_secret_32_chars_min"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
